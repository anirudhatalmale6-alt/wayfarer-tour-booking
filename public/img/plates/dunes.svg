<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img">
  <defs>
    <linearGradient id="sky-dunes" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9C4B2A"/>
      <stop offset="55%" stop-color="#D98B4A"/>
      <stop offset="100%" stop-color="#F2CE8E"/>
    </linearGradient>
    <radialGradient id="glow-dunes">
      <stop offset="0%" stop-color="#FFF0CE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFF0CE" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
